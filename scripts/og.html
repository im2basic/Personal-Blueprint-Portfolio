<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: #091D3B;
    background-image:
      linear-gradient(rgba(105,184,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(105,184,255,0.06) 1px, transparent 1px),
      linear-gradient(rgba(105,184,255,0.12) 1px, transparent 1px),
      linear-gradient(90deg, rgba(105,184,255,0.12) 1px, transparent 1px);
    background-size: 40px 40px, 40px 40px, 200px 200px, 200px 200px;
    color: #fff;
    font-family: "Geist", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .corner { position: absolute; width: 72px; height: 72px; border-color: rgba(105,184,255,0.6); border-style: solid; border-width: 0; }
  .tl { top: 40px; left: 40px; border-top-width: 2px; border-left-width: 2px; }
  .tr { top: 40px; right: 40px; border-top-width: 2px; border-right-width: 2px; }
  .bl { bottom: 40px; left: 40px; border-bottom-width: 2px; border-left-width: 2px; }
  .br { bottom: 40px; right: 40px; border-bottom-width: 2px; border-right-width: 2px; }
  .card { text-align: center; }
  .eyebrow {
    font-family: "JetBrains Mono", monospace;
    font-size: 20px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: rgba(105,184,255,0.85);
  }
  h1 { font-size: 84px; font-weight: 700; letter-spacing: -0.02em; margin-top: 28px; }
  .role { font-family: "JetBrains Mono", monospace; font-size: 30px; color: #69B8FF; margin-top: 20px; }
  .projects {
    font-family: "JetBrains Mono", monospace;
    font-size: 20px;
    color: rgba(255,255,255,0.55);
    margin-top: 44px;
  }
  .ok { color: #00D084; }
</style>
</head>
<body>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
  <div class="card">
    <p class="eyebrow">blueprint → build → production</p>
    <h1>Anisong Chanthalalay</h1>
    <p class="role">Full-Stack Product Engineer</p>
    <p class="projects"><span class="ok">✓</span> FlipSide · PocketWorship · StampKit · Deckly · Dewy</p>
  </div>
</body>
</html>
